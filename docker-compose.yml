version: '3.8'

services:
  # ChromaDB vector database
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j knowledge graph database
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"  # HTTP UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j:/data
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache for patterns
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - scraper-network
    command: redis-server --appendonly yes

  # Web scraper application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-scraper-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - CHROMA_URL=http://chromadb:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_URL=redis://redis:6379
    depends_on:
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped

networks:
  scraper-network:
    driver: bridge

volumes:
  chroma-data:
  neo4j-data:
  redis-data:
